name: Release

# A merge to main that changes the version releases it, with no manual step:
#   1. read the version (package.json; common/version.ts is kept equal by a test);
#   2. if the tag vX.Y.Z does not exist yet, take the release notes from the
#      "## [X.Y.Z]" section of CHANGELOG.md (fail if there is none);
#   3. build and push the Docker image X.Y.Z / X.Y / X (docker-publish.yml);
#   4. create the tag vX.Y.Z on the merged commit and the GitHub release.
# A merge that keeps the version (docs, CI, refactor) releases nothing.

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Is it already released?
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already exists: nothing to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the release notes
        if: steps.check.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/release-notes.sh "$VERSION" > /dev/null

  docker:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  release:
    needs: [prepare, docker]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          .github/scripts/release-notes.sh "$VERSION" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
