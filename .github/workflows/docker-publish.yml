name: Build & Push Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  # Build only (no push) on pull requests, so a broken Dockerfile shows up
  # before the merge.
  pull_request:
  # Called by release.yml with the version it is releasing: a tag created by
  # the workflow's own token does not trigger the `push: tags` event above.
  workflow_call:
    inputs:
      version:
        description: Version being released (X.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: hub2rock/planka-v2-mcp
          tags: |
            # push to main -> rolling :latest
            type=raw,value=latest,enable={{is_default_branch}}
            # git tag vX.Y.Z pushed by hand -> :X.Y.Z, :X.Y, :X (+ :latest below)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # release.yml -> :X.Y.Z, :X.Y, :X for the version it releases
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            # immutable per-commit tag
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
